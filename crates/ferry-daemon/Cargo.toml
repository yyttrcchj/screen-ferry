[package]
name = "ferry-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "screenferry"
path = "src/main.rs"
test = false

[dependencies]
ferry-core.workspace = true
ferry-engine.workspace = true
ferry-ipc.workspace = true
ferry-platform.workspace = true
ferry-store.workspace = true
ferry-trust.workspace = true
ferry-types.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal"] }
sys-locale.workspace = true
time = { workspace = true, features = ["formatting", "local-offset", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["time"] }

# 把图标、版本信息和程序清单编进 Windows 程序，见 build.rs。
[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ferry-platform-windows.workspace = true
png.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ferry-platform-macos.workspace = true
png.workspace = true
tray-icon.workspace = true

[lints]
workspace = true
